context: |
  PickleScore: ESP32-owned manual scoring and signed local OTA, with a 64x16
  landscape P10 display and an Android BLE controller. Firmware owns the state;
  Android renders reported state. Specs 01–04 in docs/specs/ govern behavior.
  Keep the approved landscape mapping, timing, controls and safety margins.
  See docs/development.md for explicit build/test targets and emulator setup.
  Deployment and hardware verification require separate owner authorization;
  USB operations require fresh isolation. Never commit credentials or backups.

