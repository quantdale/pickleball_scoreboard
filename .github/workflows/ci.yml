name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Check glyph drift (shared JSON vs firmware C++ copies)
        run: python3 scripts/check_glyphs.py

      # NOTE: never run bare `pio test` here -- it processes the esp32dev env
      # first and hangs waiting for hardware. Always pass -e native.
      - name: Run firmware host unit tests (native env)
        working-directory: firmware
        run: pio test -e native

      - name: Build firmware for esp32dev
        working-directory: firmware
        run: pio run -e esp32dev

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Uses the runner's preinstalled Android SDK (compileSdk 35 is
      # available; AGP auto-downloads any missing components).
      - name: Run unit tests and build debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug
