[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
test_build_src = yes
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.0.15
    adafruit/Adafruit GFX Library@1.12.6

[env:native]
platform = native
test_build_src = yes
build_src_filter = +<game_state.cpp> +<ble_command_parser.cpp> +<display_render_logic.cpp>
