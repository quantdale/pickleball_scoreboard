name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python3 -m pip install platformio==6.1.19

      - name: Check glyph drift (shared JSON vs firmware C++ copies)
        run: python3 scripts/check_glyphs.py

      - name: Check HUB75 brightness ladder (Spec 03 Section 2a)
        run: python3 scripts/check_brightness_levels.py

      # NOTE: never run bare `pio test` here -- it processes the esp32dev env
      # first and hangs waiting for hardware. Always pass -e native.
      - name: Run firmware host unit tests (native env)
        working-directory: firmware
        run: pio test -e native

      - name: Compare compiled firmware pixels with the shared fixtures
        run: |
          exporter="$RUNNER_TEMP/render-snapshots"
          c++ -std=c++11 -I firmware/include scripts/render_snapshots.cpp \
            firmware/src/display_render_logic.cpp -o "$exporter"
          python3 scripts/check_display_snapshots.py --cpp-tool "$exporter"

      - name: Test standalone spare-bench color diagnostic
        working-directory: hardware-tests/p10-bringup
        run: |
          binary="$RUNNER_TEMP/test-color-isolation"
          c++ -std=c++11 -I include tests/test_color_isolation.cpp -o "$binary"
          "$binary"

      - name: Build production firmware profiles
        working-directory: firmware
        run: pio run -e esp32dev -e ota -e ota_b

      - name: Audit production journal RAM and BLE write dispatch
        run: python3 scripts/check_scoring_build.py

      - name: Run OTA CLI and package regressions
        run: |
          python3 -m unittest discover -s tools -v
          python3 scripts/test_ota_tool.py \
            --output-dir "$RUNNER_TEMP/ota-tool-tests"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Uses the runner's preinstalled Android SDK (compileSdk 35 is
      # available; AGP auto-downloads any missing components).
      - name: Run unit tests and lint; build app and instrumentation APKs
        working-directory: android
        run: >-
          bash ./gradlew testDebugUnitTest lintDebug
          assembleDebug assembleDebugAndroidTest

      - name: Run Compose tests on an API 35 emulator
        working-directory: android
        timeout-minutes: 12
        run: |
          sudo chown "$USER" /dev/kvm
          image='system-images;android-35;aosp_atd;x86_64'
          sdkmanager "$image"
          echo no | avdmanager create avd -n picklescore-ci -k "$image"
          export ANDROID_SERIAL=emulator-5554
          emulator -avd picklescore-ci -port 5554 -no-window -no-snapshot \
            -no-boot-anim -no-audio -gpu swiftshader -feature -Vulkan \
            > "$RUNNER_TEMP/picklescore-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          if ! timeout 180 bash -c 'until [ "$(adb shell getprop \
            sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do
              sleep 2
            done'; then
            tail -100 "$RUNNER_TEMP/picklescore-emulator.log"
            exit 1
          fi
          adb shell setprop debug.hwui.drawing_enabled 1
          adb shell wm dismiss-keyguard
          bash ./gradlew connectedDebugAndroidTest
