context: |
  Pickleball scoreboard: ESP32 firmware (PlatformIO, Arduino C++, 64x32 HUB75
  LED panel, BLE peripheral) plus an Android Jetpack Compose BLE remote app.
  docs/specs/01-03 are the authoritative behavior contract (scoring state
  machine, BLE protocol, display rendering); both implementations follow them.
  Build and test:
    cd firmware && .venv/Scripts/pio.exe run
    cd firmware && .venv/Scripts/pio.exe test -e native
    cd android && ./gradlew assembleDebug
    cd android && ./gradlew testDebugUnitTest
  Gradle requires JAVA_HOME pointing at a JDK (Android Studio's bundled JBR
  works). Both sides are implemented and unit-tested; only manual hardware
  validation remains.

