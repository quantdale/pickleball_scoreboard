context: |
  Pickleball scoreboard: ESP32 firmware (PlatformIO, Arduino C++, two horizontal
  32x16 P10 HUB75 panels = 64x16, brightness 12/255, BLE peripheral) plus an
  Android Jetpack Compose BLE remote app with pixel-equivalent 4:1 preview.
  docs/specs/01-03 are the authoritative behavior contract (scoring state
  machine, BLE protocol, display rendering); both implementations follow them.
  Build and test:
    cd firmware && .venv/Scripts/pio.exe run -e esp32dev
    cd firmware && .venv/Scripts/pio.exe test -e native
    cd android && ./gradlew assembleDebug
    cd android && ./gradlew testDebugUnitTest
  Gradle requires JAVA_HOME pointing at a JDK (Android Studio's bundled JBR
  works). Four Unity suites (51 tests), four JUnit suites (42 tests), shared
  cross-language pixel snapshots and one actual Compose emulator test exist.
  On this Windows host use the MSVC host runner if native MinGW fails; do not
  repair unrelated libisl. Global Gradle init pins obsolete test libraries;
  use isolated session GRADLE_USER_HOME for instrumentation, not global edits.
  Bring-up is owner-accepted. Production flashing and hardware E2E remain
  owner-gated; require fresh isolated USB-only/no external 5V confirmation.
  Spec 01 follows traditional doubles side-out rules: opening server 2, then
  every full side-out starts at server 1. Keep the installed portrait mapping.
  See docs/commissioning-dual-p10.md for acceptance and rollback.

