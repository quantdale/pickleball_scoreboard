; Standalone hardware diagnostic. Does not compile or upload firmware/src.
[platformio]
default_envs = single

[env]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
build_src_filter = +<main.cpp>
; CH340 transfer corruption was observed at 460800; use a conservative rate.
upload_speed = 115200
monitor_speed = 115200
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.0.15
    adafruit/Adafruit GFX Library@1.12.6

; Flash ONLY this environment after the physical isolation checks in README.md.
[env:single]
build_flags = -DP10_PANEL_COUNT=1

; Panel 1 pass is owner-confirmed. Reconfirm USB-only isolation before flashing.
; Adds independent panel colors, coordinate grid and column/row sweeps.
[env:dual]
build_flags = -DP10_PANEL_COUNT=2

; Final pixel-boundary diagnostic. Explicit selection preserves single/dual.
[env:boundary]
build_flags = -DP10_PANEL_COUNT=2 -DP10_BOUNDARY_TEST=1

; Build-only until expressly authorized on a separate spare (never Court 1).
[env:color_isolation]
build_src_filter = +<color_isolation.cpp>
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit BusIO@1.17.4
