[common]
; Scoring owns ATT responses for its write-only characteristic (Spec 02 §6).
scoring_flags = -Wl,--wrap=esp_ble_gatts_register_callback

[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
test_build_src = yes
build_flags = ${common.scoring_flags}
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.0.15
    adafruit/Adafruit GFX Library@1.12.6

; Opt-in only: do NOT upload without fresh isolation AND partition-migration approval.
[env:ota]
extends = env:esp32dev
board_build.partitions = partitions_ota.csv
extra_scripts = pre:../scripts/ota_build_id.py
board_upload.maximum_size = 2031616
build_flags = ${common.scoring_flags} -DPICKLE_OTA_ENABLED=1 -DOTA_BUILD_VARIANT=1 -Wl,--wrap=esp_timer_delete

[env:ota_b]
extends = env:ota
build_flags = ${common.scoring_flags} -DPICKLE_OTA_ENABLED=1 -DOTA_BUILD_VARIANT=2 -Wl,--wrap=esp_timer_delete

; Bench-only OTA images. Build only unless specifically authorized; never deploy by default.
[env:ota_budget]
extends = env:ota
build_flags = ${env:ota.build_flags} -DPICKLE_OTA_DIAGNOSTICS=1 -Wl,--wrap=multi_heap_malloc,--wrap=multi_heap_aligned_alloc,--wrap=multi_heap_realloc

[env:ota_ownership]
extends = env:ota_budget
build_flags = ${env:ota_budget.build_flags} -DPICKLE_OTA_OWNERSHIP=1 -Wl,--wrap=multi_heap_free

; Failed-trial fixture: build only. Separate owner approval; prefer a matching spare.
[env:ota_rollback_test]
extends = env:ota
build_flags = ${env:ota.build_flags} -DPICKLE_OTA_ROLLBACK_TEST=1

[env:native]
platform = native
test_build_src = yes
build_src_filter = +<game_state.cpp> +<ble_command_parser.cpp> +<display_render_logic.cpp>
